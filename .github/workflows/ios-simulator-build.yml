name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-gogyo-outfit-build
    paths:
      - "ios/GogyoOutfit/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "assets/**"
      - "daily/**"
      - ".github/workflows/ios-simulator-build.yml"

permissions:
  contents: read

jobs:
  build-run-screenshot:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Create simulator
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes available -j | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          runtimes = [
              runtime for runtime in data.get("runtimes", [])
              if runtime.get("isAvailable") and runtime.get("platform") == "iOS"
          ]
          if not runtimes:
              raise SystemExit(1)
          print(sorted(runtimes, key=lambda item: item.get("version", ""))[-1]["identifier"])')"
          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          device_types = [
              item for item in data.get("devicetypes", [])
              if item.get("name", "").startswith("iPhone") and item.get("identifier")
          ]
          if not device_types:
              raise SystemExit(1)
          preferred = [item for item in device_types if "Pro" in item.get("name", "")]
          print((preferred or device_types)[-1]["identifier"])')"
          DEVICE_ID="$(xcrun simctl create 'Gogyo CI iPhone' "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::Could not create iPhone simulator."
            exit 1
          fi
          echo "RUNTIME_ID=$RUNTIME_ID"
          echo "DEVICE_TYPE_ID=$DEVICE_TYPE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices "$DEVICE_ID"

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/GogyoOutfit/GogyoOutfit.xcodeproj \
            -scheme GogyoOutfit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build app for launch
        run: |
          DERIVED_DATA="$RUNNER_TEMP/GogyoOutfitDerivedData"
          xcodebuild \
            -project ios/GogyoOutfit/GogyoOutfit.xcodeproj \
            -scheme GogyoOutfit \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name 'GogyoOutfit.app' -maxdepth 2 -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Built app bundle was not found."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Shutdown existing simulators
        run: |
          pkill -9 Simulator || true

      - name: Start simulator boot
        run: |
          xcrun simctl boot "$DEVICE_ID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
          BOOT_PID="$!"
          sleep 10
          if kill -0 "$BOOT_PID" 2>/dev/null; then
            echo "simctl boot is still running after 10 seconds; continuing with bootstatus."
            kill "$BOOT_PID" || true
          fi
          cat "$RUNNER_TEMP/simctl-boot.log" || true
          xcrun simctl list devices "$DEVICE_ID"

      - name: Wait for simulator boot
        run: |
          python3 - <<'PY'
          import os
          import signal
          import subprocess

          command = ["xcrun", "simctl", "bootstatus", os.environ["DEVICE_ID"], "-b"]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              raise SystemExit(process.wait(timeout=240))
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGTERM)
              subprocess.run(["xcrun", "simctl", "list", "devices", os.environ["DEVICE_ID"]], check=False)
              raise SystemExit("simulator did not finish booting within 240 seconds")
          PY

      - name: Install and launch app
        run: |
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.gogyo.outfitdaily
          sleep 8

      - name: Capture simulator screenshot
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshots/gogyo-home.png"
          echo "SCREENSHOT_PATH=$RUNNER_TEMP/screenshots/gogyo-home.png" >> "$GITHUB_ENV"

      - name: Verify screenshot
        run: |
          test -s "$SCREENSHOT_PATH"
          sips -g pixelWidth -g pixelHeight "$SCREENSHOT_PATH"

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gogyo-home-screenshot
          path: ${{ env.SCREENSHOT_PATH }}