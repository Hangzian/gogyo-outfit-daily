name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-gogyo-outfit-build
    paths:
      - "ios/GogyoOutfit/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "assets/**"
      - "daily/**"
      - ".github/workflows/ios-simulator-build.yml"

permissions:
  contents: read

jobs:
  build-run-screenshot:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Create simulator
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes available -j | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          runtimes = [
              runtime for runtime in data.get("runtimes", [])
              if runtime.get("isAvailable") and runtime.get("platform") == "iOS"
          ]
          if not runtimes:
              raise SystemExit(1)
          print(sorted(runtimes, key=lambda item: item.get("version", ""))[-1]["identifier"])')"
          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | /usr/bin/python3 -c 'import json, sys
          data = json.load(sys.stdin)
          device_types = [
              item for item in data.get("devicetypes", [])
              if item.get("name", "").startswith("iPhone") and item.get("identifier")
          ]
          if not device_types:
              raise SystemExit(1)
          preferred = [item for item in device_types if "Pro" in item.get("name", "")]
          print((preferred or device_types)[-1]["identifier"])')"
          DEVICE_ID="$(xcrun simctl create 'Gogyo CI iPhone' "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::Could not create iPhone simulator."
            exit 1
          fi
          echo "RUNTIME_ID=$RUNTIME_ID"
          echo "DEVICE_TYPE_ID=$DEVICE_TYPE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices "$DEVICE_ID"

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/GogyoOutfit/GogyoOutfit.xcodeproj \
            -scheme GogyoOutfit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build app for launch
        run: |
          DERIVED_DATA="$RUNNER_TEMP/GogyoOutfitDerivedData"
          xcodebuild \
            -project ios/GogyoOutfit/GogyoOutfit.xcodeproj \
            -scheme GogyoOutfit \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -name 'GogyoOutfit.app' -maxdepth 2 -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Built app bundle was not found."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator and launch app
        run: |
          xcrun simctl shutdown all || true
          python3 - <<'PY'
          import os
          import subprocess

          device_id = os.environ["DEVICE_ID"]
          try:
              subprocess.run(["xcrun", "simctl", "boot", device_id], check=False, timeout=90)
          except subprocess.TimeoutExpired:
              print("simctl boot timed out; checking bootstatus anyway")

          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", device_id, "-b"], check=True, timeout=240)
          except Exception:
              subprocess.run(["xcrun", "simctl", "list", "devices", device_id], check=False)
              raise
          PY
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.gogyo.outfitdaily
          sleep 8
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshots/gogyo-home.png"
          echo "SCREENSHOT_PATH=$RUNNER_TEMP/screenshots/gogyo-home.png" >> "$GITHUB_ENV"

      - name: Install screenshot inspector
        run: python3 -m pip install --user pillow

      - name: Inspect screenshot pixels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import os

          path = Path(os.environ["SCREENSHOT_PATH"])
          image = Image.open(path).convert("RGB")
          stat = ImageStat.Stat(image)
          extrema = image.getextrema()
          print("screenshot", image.size, "mean", stat.mean, "extrema", extrema)
          if all(channel[0] == channel[1] for channel in extrema):
              raise SystemExit("screenshot is a single flat color")
          if sum(stat.mean) / 3 > 252:
              raise SystemExit("screenshot is too close to blank white")
          PY

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gogyo-home-screenshot
          path: ${{ env.SCREENSHOT_PATH }}
